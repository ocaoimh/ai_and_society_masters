:root{--coral:#FF5B29;--blue:#102547;--beige:#F5EFE6;--black:#000;--white:#fff;--yellow:#FFEC00;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--beige);color:var(--black);font-family:"Poppins",Arial,sans-serif;font-size:17px;line-height:1.4}
main{max-width:34rem;margin:0 auto;padding:1.25rem 1.25rem 3rem}
header{display:flex;align-items:center;gap:.6rem;margin-bottom:1.5rem}
header svg{width:30px;height:30px;transform:rotate(0)}
header span{font-family:"Ambit",Arial,sans-serif;font-weight:700;font-size:1rem}
h1{font-family:"Ambit",Arial,sans-serif;font-weight:700;font-size:1.6rem;line-height:1.1;margin:0 0 1.25rem}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:1rem 1.1rem;margin:0 0 .7rem;border:2px solid var(--blue);background:var(--white);color:var(--black);border-radius:10px;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--blue);color:var(--white)}
.opt:focus-visible,textarea:focus-visible,.send:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
textarea{width:100%;min-height:7rem;font:inherit;padding:.9rem;border:2px solid var(--blue);border-radius:10px;resize:vertical}
.count{font-size:.85rem;text-align:right;margin:.3rem 0 .9rem}
.send{font:inherit;font-weight:700;background:var(--coral);color:var(--white);border:0;border-radius:10px;padding:.9rem 1.4rem;cursor:pointer}
.send[disabled]{opacity:.5;cursor:default}
.status{margin-top:1rem;min-height:1.5rem}
.wait{padding:2rem 0}
.wait p{margin:.4rem 0}
.err{color:#b00020}
</style>

<script>
var cid; try { cid = localStorage.getItem('bsf-cid'); if (!cid) { cid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('bsf-cid', cid); } } catch (e) { cid = Math.random().toString(36).slice(2) + Date.now().toString(36); }
var current = null, sent = {};
var app = document.getElementById('app');

function el(tag, attrs, text) { var n = document.createElement(tag); for (var k in (attrs || {})) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; return n; }

function render(q) {
  app.innerHTML = '';
  if (!q) {
    var w = el('div', {class: 'wait'});
    w.appendChild(el('h1', null, 'Waiting for the next question'));
    w.appendChild(el('p', null, 'Keep this page open. Questions appear here when they’re on screen.'));
    app.appendChild(w); return;
  }
  app.appendChild(el('h1', null, q.prompt));
  var status = el('p', {class: 'status'});
  if (q.type === 'mcq') {
    q.options.forEach(function (o, i) {
      var b = el('button', {class: 'opt', type: 'button', 'aria-pressed': String(sent[q.id] === String(i))}, o);
      b.onclick = function () {
        status.textContent = 'Sending…'; status.className = 'status';
        google.script.run.withSuccessHandler(function () {
          sent[q.id] = String(i);
          [].forEach.call(app.querySelectorAll('.opt'), function (x, j) { x.setAttribute('aria-pressed', String(j === i)); });
          status.textContent = 'Answer received. You can change it while the question is open.';
        }).withFailureHandler(function (e) { status.textContent = e.message; status.className = 'status err'; }).submit(q.id, String(i), cid);
      };
      app.appendChild(b);
    });
    if (sent[q.id] != null) status.textContent = 'Answer received. You can change it while the question is open.';
  } else {
    var ta = el('textarea', {maxlength: '200', 'aria-label': 'Your answer'});
    if (sent[q.id]) ta.value = sent[q.id];
    var count = el('p', {class: 'count'}, (ta.value.length) + ' / 200');
    var btn = el('button', {class: 'send', type: 'button'}, sent[q.id] ? 'Update answer' : 'Send answer');
    ta.oninput = function () { count.textContent = ta.value.length + ' / 200'; btn.disabled = !ta.value.trim(); };
    btn.disabled = !ta.value.trim();
    btn.onclick = function () {
      var v = ta.value.trim(); if (!v) return;
      btn.disabled = true; status.textContent = 'Sending…'; status.className = 'status';
      google.script.run.withSuccessHandler(function () {
        sent[q.id] = v; btn.textContent = 'Update answer'; btn.disabled = false;
        status.textContent = 'Answer received. Answers appear on screen without your name.';
      }).withFailureHandler(function (e) { btn.disabled = false; status.textContent = e.message; status.className = 'status err'; }).submit(q.id, v, cid);
    };
    app.appendChild(ta); app.appendChild(count); app.appendChild(btn);
  }
  app.appendChild(status);
}

function poll() {
  google.script.run.withSuccessHandler(function (q) {
    var id = q ? q.id : null, cur = current ? current.id : null;
    if (id !== cur) { current = q; render(q); }
    setTimeout(poll, 4000);
  }).withFailureHandler(function () { setTimeout(poll, 8000); }).getActive();
}
poll();
</script>
</body>
</html>
